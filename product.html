<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ShopSphere Products">
    <title>Products | ShopSphere</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="container nav">

        <a href="index.html" class="logo">🛍️ ShopSphere</a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="product.html">Products</a>
            <a href="about.html">About</a>
            <a href="cart.html">🛒 Cart <span id="cart-count">0</span></a>
        </nav>

        <button class="menu-btn" onclick="toggleMenu()">☰</button>
    </div>

    <div class="mobile-menu" id="mobile-menu">
        <a href="index.html">Home</a>
        <a href="product.html">Products</a>
        <a href="about.html">About</a>
        <a href="cart.html">🛒 Cart</a>
    </div>
</header>

<main>

<section class="products-section">
    <div class="container">

        <h1>Our Products</h1>
        <p>Find products you'll love.</p>

        <div class="product-controls">

            <input
                type="text"
                id="search-input"
                placeholder="Search products..."
                oninput="filterProducts()"
            >

            <select id="category-filter" onchange="filterProducts()">
                <option value="all">All Categories</option>
                <option value="electronics">Electronics</option>
                <option value="fashion">Fashion</option>
                <option value="accessories">Accessories</option>
                <option value="home">Home</option>
            </select>

        </div>

        <div id="product-grid" class="product-grid"></div>

        <p id="no-results" class="no-results">
            No products found.
        </p>

    </div>
</section>

</main>

<footer class="footer">
    <div class="container">
        <h3>🛍️ ShopSphere</h3>
        <p>Modern E-Commerce Product Catalog.</p>

        <div class="footer-links">
            <a href="index.html">Home</a>
            <a href="product.html">Products</a>
            <a href="about.html">About</a>
            <a href="cart.html">Cart</a>
        </div>

        <p class="copyright">
            © 2026 ShopSphere | Thiranex Task 5
        </p>
    </div>
</footer>

<script src="product.js"></script>

</body>
</html>
